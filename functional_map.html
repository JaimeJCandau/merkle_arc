<style>
:root { --page:#ffffff; --legend-text:#808080; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --page:#141414; --legend-text:#9a9a9a; color-scheme:dark; } }
html,body { margin:0; background:var(--page); }
.wrap { max-width:1100px; margin:0 auto; padding:24px 16px; }
svg { width:100%; height:auto; display:block; font-family:Aptos,"Segoe UI","Helvetica Neue",Arial,sans-serif; }
text { dominant-baseline:central; }
.shell { fill:#232323; stroke:#ffffff; stroke-width:.7; }
.layer { fill:#595959; stroke:#595959; stroke-width:.7; }
.layer.op { fill:#3A3A3A; stroke:#3A3A3A; }
.layer-title { fill:#ffffff; font-size:14.6px; }
.link { stroke:#E8E8E8; stroke-width:1.4; stroke-dasharray:1.4 1.4; }
.mod rect { fill:#F2F2F2; stroke:#030E13; stroke-width:.7; }
.mod.progress rect { stroke-width:2.1; stroke-dasharray:8 6; }
.mod text { font-size:14.6px; font-weight:700; text-anchor:middle; }
.mod text.arc { fill:#0328D1; }
.mod text.conn { fill:#000000; }
.ext rect { fill:#808080; stroke:#030E13; stroke-width:.7; }
.ext text { fill:#D9D9D9; font-size:15px; font-weight:700; text-anchor:middle; }
.legend text { fill:var(--legend-text); font-size:12.5px; }
.legend text.lg-arc { fill:#0328D1; font-size:10px; font-weight:700; text-anchor:middle; }
.op { fill:#3D3D3D; stroke:#3D3D3D; }
.legend text.lg-arc { fill:#0328D1; font-weight:700; text-anchor:middle; }
.item { cursor:pointer; outline:none; transition:opacity .15s ease; }
.link { transition:opacity .15s ease; }
svg.dim .item:not(.on), svg.dim > .link { opacity:.22; }
.hit { stroke:transparent; stroke-width:14; pointer-events:stroke; }
.cline .link { pointer-events:none; }
.panel.item:focus-visible rect { stroke:#0328D1; stroke-width:2.5; }
.item:focus-visible rect { stroke:#0328D1; stroke-width:2.5; }
@media (prefers-reduced-motion: reduce) { .item, .link { transition:none; } }
.dd { transform-box:fill-box; transform-origin:top; transform:scaleY(0); opacity:0; pointer-events:none; transition:transform .2s ease, opacity .15s ease; }
.dd rect { fill:#6E6E6E; stroke:#030E13; stroke-width:.7; }
.dd text { fill:#F2F2F2; font-size:13.5px; font-weight:400; text-anchor:start; }
.item.on .dd { transform:scaleY(1); opacity:1; pointer-events:auto; }
@media (prefers-reduced-motion: reduce) { .dd { transition:none; } }
.lg-ext { fill:#808080; stroke:#030E13; stroke-width:.7; }
.lg-dev { fill:#F2F2F2; stroke:#030E13; stroke-width:.7; }
.lg-prog { fill:#F2F2F2; stroke:#BFBFBF; stroke-width:2.1; stroke-dasharray:3 2; }
</style>

</div>
<script>
(function(){
  const svg=document.querySelector('svg'), items=[...svg.querySelectorAll('.item')];
  let pinned=null, t=null;
  const show=el=>{ clearTimeout(t); items.forEach(i=>i.classList.toggle('on',!!(i===el||(el.classList.contains('panel')&&i.dataset.group===el.dataset.group)||(el.dataset.cg&&i.dataset.cg===el.dataset.cg)))); svg.classList.add('dim'); };
  const clear=()=>{ items.forEach(i=>i.classList.remove('on')); svg.classList.remove('dim'); };
  const leave=()=>{ if(pinned) return; clearTimeout(t); t=setTimeout(clear,120); };
  items.forEach(el=>{
    el.addEventListener('pointerenter',()=>{ if(!pinned) show(el); });
    el.addEventListener('pointerleave',leave);
    el.addEventListener('focus',()=>{ if(!pinned) show(el); });
    el.addEventListener('blur',leave);
    const toggle=()=>{ if(pinned===el){ pinned=null; clear(); } else { pinned=el; show(el); } };
    el.addEventListener('click',e=>{ e.stopPropagation(); toggle(); });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });
  document.addEventListener('click',()=>{ if(pinned){ pinned=null; clear(); } });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&pinned){ pinned=null; clear(); } });
})();
</script>
